version: "3.8"

services:
  ainl-runner:
    build:
      context: ../..
      dockerfile: services/runtime_runner/Dockerfile
    mem_limit: 256m
    memswap_limit: 320m
    cpus: 0.25
    pids_limit: 128
    ports:
      - "8770:8770"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
